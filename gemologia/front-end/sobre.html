</head>
<body>
    <header>
        <div class="logoBarra">
            <a href="index.html" class="logo">
                <img src="imagens/Logo CEAG.com com Diamante Azul Facetado.png"
                alt="Logo do site/projeto">
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="brasil.html">Gemologia no Brasil</a></li>
                    <li><a href="identificacao.html">Identificação de gemas</a></li>

                    <li><a href="sobre.html">Sobre o projeto</a></li>>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <hr>
            <h2>Fale conosco</h2>
            <form method="POST">
                <label for="form-nome">Nome: </label>
                <input type="text" id="form-nome" name="Nome" placeholder="Seu nome" required>
                <label for="form-email">E-mail: </label>
                <input type="email" id="form-email" name="E-mail" placeholder="seuendereco@email.com" required>
                <label for="form-telefone">Telefone: </label>
                <input type="tel" id="form-telefone" name="Telefone" placeholder="(DDD) 12345-6789" pattern>
                <label for="form-assunto">Assunto: </label>
                <select id="form-assunto" name="Assunto">
                    <option value="">Selecione um assunto</option>
                    <option value="sugestão">Sugestão para o site</option>
                    <option value="erro">Reportar um erro</option>
                    <option value="atualizar">Atualizar um dado</option>
                    <option value="gemas">Gemas preciosas e semipreciosas</option>
                    <option value="minerais">Minerais e suas propriedades</option>
                    <option value="rochas">Rochas e suas classificações</option>
                    <option value="identificacao">Identificação e características das pedras</option>
                    <option value="outro">Outro</option>
                </select>
                <label for="form-mensagem">Mensagem: </label>
                <textarea id="form-mensagem" name="Mensagem" placeholder="Sua mensagem" required></textarea>
                <button type="submit">Enviar tudo</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Projeto acadêmico • IFRN © 2026 CEAG.com. Todos os direitos reservados</p>
    </footer>
</body>
</html>
